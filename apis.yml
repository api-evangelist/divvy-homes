aid: divvy-homes
name: Divvy Homes
description: >-
  Divvy Homes is a San Francisco-based proptech company operating a rent-to-own
  home ownership program. A customer chooses a home on the open market, Divvy
  purchases it, and the customer moves in as a renter while a portion of each
  monthly payment builds toward a future down payment, giving aspiring buyers
  who are not yet mortgage-ready a path toward eventual ownership. The consumer
  web experience integrates third-party services such as Plaid for bank
  connectivity and Stripe for payments, but Divvy exposes no public developer
  API, developer portal, or API documentation surface of its own. This profile
  was surfaced from venture-portfolio data (a16z, Threshold Ventures) and
  enriched from Divvy's public consumer website only.
